<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7ec">
    <meta name="description" content="2026 AI 芳療活動報名，歡迎一起探索 AI 與芳療的美好相遇。">
    <title>2026 AI 芳療活動｜活動報名</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #263b32;
        --muted: #718078;
        --green: #2e7158;
        --green-dark: #20553f;
        --lime: #d7ec9b;
        --paper: #fffefa;
        --line: #e7eadf;
        --peach: #f8dfca;
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(ellipse at 2% 20%, #edf3d7 0, transparent 33rem),
          #f6f7ec;
        color: var(--ink);
      }

      .page {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 64px;
      }

      .event-header {
        min-height: 112px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 4px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .2em;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 48px);
        font-weight: 800;
        letter-spacing: .025em;
        line-height: 1.2;
      }

      .header-note {
        flex: 0 0 auto;
        padding: 11px 17px;
        border: 1px solid #dfe7cc;
        border-radius: 999px;
        background: #ffffff9c;
        color: var(--green-dark);
        font-size: 14px;
        font-weight: 700;
      }

      .hero {
        position: relative;
        overflow: hidden;
        height: clamp(210px, 35vw, 380px);
        border-radius: 28px;
        background: #dfe7d2;
        box-shadow: 0 18px 50px #263b321c;
      }

      .hero img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .hero::after {
        position: absolute;
        inset: 45% 0 0;
        background: linear-gradient(transparent, #152c2480);
        content: "";
        pointer-events: none;
      }

      .hero-caption {
        position: absolute;
        z-index: 1;
        right: 30px;
        bottom: 24px;
        left: 30px;
        color: white;
        font-size: clamp(14px, 2vw, 18px);
        font-weight: 600;
        text-shadow: 0 1px 8px #152c2466;
      }

      .content-grid {
        display: grid;
        grid-template-columns: minmax(0, .88fr) minmax(360px, 1.12fr);
        align-items: start;
        gap: 24px;
        margin-top: 28px;
      }

      .card {
        border: 1px solid #eaecdf;
        border-radius: 24px;
        background: var(--paper);
        box-shadow: 0 12px 35px #263b320d;
      }

      .event-details {
        padding: 30px;
      }

      .section-kicker {
        margin: 0 0 8px;
        color: var(--green);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .18em;
      }

      h2 {
        margin: 0;
        font-size: 25px;
        line-height: 1.4;
      }

      .intro {
        margin: 13px 0 26px;
        color: var(--muted);
        line-height: 1.85;
      }

      .detail-list {
        display: grid;
        gap: 12px;
        margin: 0;
      }

      .detail-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 12px;
        padding: 15px 16px;
        border-radius: 15px;
        background: #f5f7ed;
      }

      .detail-row dt {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .detail-row dd {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }

      .note {
        margin: 20px 2px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .registration {
        padding: 30px;
      }

      .form-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 22px;
      }

      .required-note {
        padding-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px 14px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field.full { grid-column: 1 / -1; }

      label {
        font-size: 13px;
        font-weight: 700;
      }

      .required { color: #d56f4c; }

      input {
        width: 100%;
        min-height: 48px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
        background: #fff;
        color: var(--ink);
        font: inherit;
        transition: border-color .2s, box-shadow .2s;
      }

      input::placeholder { color: #aab2a9; }

      input:focus {
        border-color: #77a88e;
        box-shadow: 0 0 0 3px #77a88e26;
      }

      .submit-button {
        width: 100%;
        min-height: 52px;
        margin-top: 22px;
        border: 0;
        border-radius: 14px;
        background: var(--green);
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: background .2s, transform .2s;
      }

      .submit-button:hover:not(:disabled) {
        transform: translateY(-1px);
        background: var(--green-dark);
      }

      .submit-button:disabled { cursor: wait; opacity: .7; }

      .form-status {
        min-height: 22px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .form-status[data-state="success"] { color: var(--green-dark); }
      .form-status[data-state="error"] { color: #b94d38; }

      .footer {
        padding: 26px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .hidden-frame {
        position: absolute;
        width: 1px;
        height: 1px;
        border: 0;
        opacity: 0;
        pointer-events: none;
      }

      @media (max-width: 760px) {
        .page { width: min(100% - 28px, 560px); padding-top: 12px; }
        .event-header { min-height: 100px; }
        .header-note { display: none; }
        .hero { border-radius: 20px; }
        .hero-caption { right: 18px; bottom: 17px; left: 18px; }
        .content-grid { grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
        .event-details, .registration { padding: 23px; }
      }

      @media (max-width: 420px) {
        .fields { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
        .detail-row { grid-template-columns: 62px 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="event-header">
        <div>
          <p class="eyebrow">WELLNESS × INNOVATION</p>
          <h1>2026 AI 芳療活動</h1>
        </div>
        <div class="header-note">探索香氣與科技的相遇</div>
      </header>

      <section class="hero" aria-label="活動主視覺">
        <img src="./cover.png" alt="2026 AI 芳療活動封面">
        <div class="hero-caption">讓熟悉的香氣，遇見全新的靈感。</div>
      </section>

      <section class="content-grid" aria-label="活動內容與報名表單">
        <article class="card event-details">
          <p class="section-kicker">ABOUT THE EVENT</p>
          <h2>一起感受 AI 與芳療的美好相遇</h2>
          <p class="intro">在輕鬆明亮的午後，透過香氣與創新靈感，開啟一場身心放鬆的體驗。</p>
          <dl class="detail-list">
            <div class="detail-row">
              <dt>日期</dt>
              <dd>2026 年 11 月（日期待定）</dd>
            </div>
            <div class="detail-row">
              <dt>時間</dt>
              <dd>14:00 至 16:30</dd>
            </div>
            <div class="detail-row">
              <dt>地點</dt>
              <dd>益福和生醫公司</dd>
            </div>
          </dl>
          <p class="note">日期確認後將另行通知，歡迎先填寫表單保留參加意願。</p>
        </article>

        <section class="card registration" aria-labelledby="form-title">
          <div class="form-heading">
            <div>
              <p class="section-kicker">SAVE YOUR SEAT</p>
              <h2 id="form-title">活動報名</h2>
            </div>
            <div class="required-note"><span class="required">*</span> 必填</div>
          </div>
          <form id="registration-form">
            <div class="fields">
              <div class="field">
                <label for="name">姓名 <span class="required">*</span></label>
                <input id="name" name="name" autocomplete="name" maxlength="100" placeholder="請輸入姓名" required>
              </div>
              <div class="field">
                <label for="email">Email <span class="required">*</span></label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required>
              </div>
              <div class="field">
                <label for="unit">單位</label>
                <input id="unit" name="unit" autocomplete="organization" maxlength="120" placeholder="請輸入單位">
              </div>
              <div class="field">
                <label for="phone">電話 <span class="required">*</span></label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="請輸入聯絡電話" required>
              </div>
              <div class="field full">
                <label for="title">職稱</label>
                <input id="title" name="title" maxlength="120" placeholder="請輸入職稱">
              </div>
            </div>
            <button class="submit-button" id="submit-button" type="submit">送出報名</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </section>
      <footer class="footer">期待與你在香氣中相見</footer>
    </main>
    <iframe class="hidden-frame" id="submission-frame" name="submission-frame" title="報名送出回覆"></iframe>

    <script>
      // Set this to the deployed Apps Script web app URL after deployment.
      const SCRIPT_URL = "";
      const form = document.querySelector("#registration-form");
      const status = document.querySelector("#form-status");
      const button = document.querySelector("#submit-button");
      const frame = document.querySelector("#submission-frame");
      let activeRequestId = "";

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!SCRIPT_URL) {
          setStatus("報名服務尚未設定，請稍後再試。", "error");
          return;
        }

        activeRequestId = window.crypto.randomUUID();
        const requestId = document.createElement("input");
        requestId.type = "hidden";
        requestId.name = "requestId";
        requestId.value = activeRequestId;
        form.append(requestId);
        form.action = SCRIPT_URL;
        form.method = "post";
        form.target = "submission-frame";
        button.disabled = true;
        setStatus("報名資料送出中，請稍候…");
        form.submit();
        requestId.remove();
      });

      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow ||
            !event.data ||
            event.data.type !== "registration-result" ||
            event.data.requestId !== activeRequestId) return;

        button.disabled = false;
        activeRequestId = "";
        if (event.data.success) {
          form.reset();
          setStatus("報名完成！期待與你在活動中相見。", "success");
        } else {
          setStatus("送出失敗，請稍後再試；若問題持續，請聯絡活動主辦單位。", "error");
        }
      });

      function setStatus(message, state) {
        status.textContent = message;
        status.dataset.state = state || "";
      }
    </script>
  </body>
</html>
